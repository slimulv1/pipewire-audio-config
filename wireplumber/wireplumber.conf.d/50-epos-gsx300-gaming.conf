# ============================================================================
#  EPOS GSX 300 (DAC gaming) - chuyên dụng khi chơi game
# ----------------------------------------------------------------------------
#  Card thật: alsa_card.usb-Sennheiser_EPOS_GSX_300_A003200202602692-00
#  Node thật:
#    alsa_output.usb-Sennheiser_EPOS_GSX_300_A003200202602692-00.analog-stereo
#    alsa_input.usb-Sennheiser_EPOS_GSX_300_A003200202602692-00.mono-fallback
#  ALSA id = "E300", chip Conexant CX21988, stereo-only trên Linux.
#
#  KHÔNG dùng `monitor.alsa.rules` cũ với dấu chấm chưa escape:
#  "alsa_output.usb-Sennheiser..." - dấu "." khớp BẤT KỲ ký tự nào,
#  dễ khớp nhầm card khác. Dưới đây đã escape và neo ^ .
# ============================================================================

monitor.alsa.rules = [
  # (1) OUTPUT EPOS -> profile "gaming"
  {
    matches = [
      { node.name = "~^alsa_output\\.usb-Sennheiser_EPOS_GSX_300" }
    ]
    actions = {
      update-props = {
        # (1a) Tắt idle-suspend: đây là nguyên nhân #1 bị ngắt tiếng /
        #      pop khi game bật lại sau khoảng im lặng.
        #      suspend-node.lua:41 đọc key này (mặc định 5 giây).
        session.suspend-timeout-seconds = 0

        # (1b) Latency thấp cho gaming.
        #      ĐO THỰC TẾ (pw-top -b, có client đang phát):
        #        QUANT=256 @48000 = 5.33 ms, ERR=0
        node.latency = "256/48000"

        # (1c) Pin 48kHz. EPOS không có native 44100.
        audio.rate    = 48000

        # (1d) Pin 24-bit stereo - nâng chất lượng thật sự.
        #      ĐO THỰC TẾ trước/sau (pactl list sinks):
        #        KHÔNG có config -> s16le 2ch 48000Hz
        #        CÓ config      -> s24le 2ch 48000Hz
        audio.format  = S24_3LE
        audio.channels = 2
      }
    }
  }

  # (2) INPUT/MIC EPOS -> không cho suspend để không bị mất tiếng khi bật game
  {
    matches = [
      { node.name = "~^alsa_input\\.usb-Sennheiser_EPOS_GSX_300" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]