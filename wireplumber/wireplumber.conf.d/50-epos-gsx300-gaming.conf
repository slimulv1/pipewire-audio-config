# EPOS GSX 300 (USB gaming DAC) — tối ưu cho GAMING.
# DAC: Conexant CX21988, 24-bit/96kHz, stereo-only (7.1 là Windows-only, không có trên Linux).
# Playback: S16_LE / S24_3LE @ 48000 (và 96000). KHÔNG hỗ trợ 44100.
# Capture/mic: mono S16_LE @ 48000.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-Sennheiser_EPOS_GSX_300.*" }
    ]
    actions = {
      update-props = {
        # (1) Tắt idle-suspend: tránh câm / pop khi game bắt đầu phát sau khoảng lặng
        #     (lỗi #1 của EPOS/Sennheiser USB DAC).
        session.suspend-timeout-seconds = 0
        # (2) Gaming: latency thấp để âm thanh bám sát hình ảnh.
        node.latency = "256/48000"
        # (3) Pin rate 48k: EPOS KHÔNG hỗ trợ 44100 -> tránh lỗi "cannot open at 44100"
        #     khi chuyển sang EPOS lúc nhạc 44.1k đang chạy; cũng né 96k (băng thông/ổn định).
        audio.rate = 48000
        # (4) Pin format 24-bit + 2 kênh (stereo) để luôn chạy native chất lượng cao nhất.
        audio.format = S24_3LE
        audio.channels = 2
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-Sennheiser_EPOS_GSX_300.*" }
    ]
    actions = {
      update-props = {
        # (5) Mic gaming: không suspend -> không rớt tiếng khi bắt đầu nói.
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
