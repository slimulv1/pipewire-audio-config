# Tự động route client Steam/Proton/Wine sang sink stereo "games_sink"
# (khỏi phải gõ PULSE_SINK từng game). Stream stereo -> A2+ upmix 2->8,
# firmware loa không phải downmix 8->2 -> hết rè/clip.
#
# Lưu ý: (1) KHÔNG match *steam* — Steam client (webhelper: nhạc/video) phải
# giữ nguyên đường 7.1 để không mất surround. (2) Binary của game Proton thường
# là tên game (vd DarkSoulsIII.exe) nên KHÔNG khớp pattern → với game đó dùng
# launch option:  PULSE_SINK=games_sink %command%
node.rules = [
  {
    matches = [
      { application.process.binary = "~*proton*" }
      { application.process.binary = "~*wine*" }
      { application.process.binary = "~*gamescope*" }
      { application.process.binary = "~*reaper*" }
    ]
    actions = {
      update-props = {
        target.object = "games_sink"
      }
    }
  }
]