# ============================================================================
#  games_sink auto-routing: đăng ký Lua hook (WirePlumber >= 0.5)
# ----------------------------------------------------------------------------
#  WirePlumber 0.5 KHÔNG load file .lua trong ~/.config/wireplumber/.
#  Script phải nằm ở:  $XDG_DATA_HOME/wireplumber/scripts/
#                       (~/.local/share/wireplumber/scripts/)
#  và phải được khai báo trong `wireplumber.components` + yêu cầu trong
#  profile "main". Log đã xác nhận:
#    wp-base-dirs: lookup 'games-sink-routing.lua',
#      return: /home/<user>/.local/share/wireplumber/scripts/games-sink-routing.lua
#    wp-event-dispatcher: Registered hook custom/games-sink-routing successfully
#
#  Fragment này phải nằm TRƯỚC (số nhỏ hơn) các fragment khác không sao;
#  thứ tự array của `wireplumber.components` không quan trọng vì profile
#  "main" yêu cầu feature này.
# ============================================================================

wireplumber.components = [
  {
    name = games-sink-routing.lua, type = script/lua
    provides = custom.games-sink-routing
  }
]

wireplumber.profiles = {
  main = {
    custom.games-sink-routing = required
  }
}