# Audioengine A2+ Wireless (USB Type-B) — khắc lỗi câm do idle-suspend + ưu tiên default
#
# Quan trọng: trên đời A2+ Wireless, đường USB audio (DAC hỗ trợ tới 32-bit/192kHz)
# được ALSA đặt tên là "Generic USB Audio" (KHÔNG phải "Audioengine" — cái đó là
# module Bluetooth CSR bên trong loa). Sink phát nhạc thực tế:
#   alsa_output.usb-Generic_USB_Audio-00.HiFi_7_1__Speaker__sink

# (1) Tắt idle-suspend cho A2+ -> DAC không ngủ -> không câm (đặc biệt game/Steam).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-Generic_USB_Audio.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

# (2) Ưu tiên A2+ làm thiết bị phát mặc định (cao hơn HDMI/EPOS) để sticky sau reconnect.
#     Muốn bỏ: xóa khối device.rules này, hoặc `wpctl set-default <id_epos>`.
device.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-Generic_USB_Audio-00" }
    ]
    actions = {
      update-props = {
        device.priority = 2000
      }
    }
  }
]
