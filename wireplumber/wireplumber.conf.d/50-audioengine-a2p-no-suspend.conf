# ============================================================================
#  A2+ (loa chính) — không idle-suspend + luôn là thiết bị mặc định
# ----------------------------------------------------------------------------
#  Card thật: alsa_card.usb-Generic_USB_Audio-00  (ALSA card 0)
#  USB: 0b05:1a16, High-Speed. KHÔNG phải module Bluetooth của loa — cái đó
#  là alsa_card.usb-Audioengine_Ltd._Audioengine_2__... (CSRA64210, tai nghe).
#
#  PROFILE PHẢI LÀ "HiFi" (stereo), KHÔNG phải "HiFi 7+1"
#  Đo băng thông USB, endpoint phát tối đa 186 byte/ms:
#    2ch S16LE 48k (HiFi)      = 384.000 B/s =  3,07 Mbit/s  AN TOÀN
#    8ch S32LE 48k (HiFi 7+1)  = 1.536.000 B/s = 12,29 Mbit/s  VƯỢT
#  Bản gốc để 7+1 -> vượt băng thông bus. install.sh sẽ ghim "HiFi".
#
#  KHÔNG ghim audio.format ở đây:
#  Đo bằng `aplay --dump-hw-params -D hw:0,0`: DAC chỉ nhận S16_LE.
#  Nhưng thử đặt `audio.format = S16_LE` qua update-props KHÔNG đổi được
#  định dạng thương lượng — `pactl list sinks` vẫn báo s32le, vì định dạng
#  được chốt lúc node/driver được tạo, không phải sau đó.
#  ALSA tự đổi 32->16 bit ở tầng plug, không mất chất lượng (DAC chỉ 16 bit).
#  Vì vậy bỏ hẳn thay vì giữ một dòng cấu hình chết.
#
#  GHI CHÚ: `device.rules` KHÔNG tồn tại ở WirePlumber 0.5. Đã đo được danh
#  sách section hợp lệ bằng:
#    grep -rn get_section_as_json /usr/share/wireplumber/scripts/
#  Rule device phải nằm trong `monitor.alsa.rules` (alsa.lua áp rules đó cho
#  cả node, dòng 487, lẫn device, dòng 678).
# ============================================================================

monitor.alsa.rules = [
  # (1) Không idle-suspend cho node output của A2+
  #     -> hết tiếng "poc" khi bật game sau thời gian im lặng
  #     -> không có độ trễ khởi động lúc vào game
  {
    matches = [
      { node.name = "~^alsa_output\\.usb-Generic_USB_Audio-00\\." }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }

  # (2) A2+ luôn là default sink sau khi rút/cắm lại
  {
    matches = [
      { device.name = "~^alsa_card\\.usb-Generic_USB_Audio-00$" }
    ]
    actions = {
      update-props = {
        device.priority = 2000
      }
    }
  }
]