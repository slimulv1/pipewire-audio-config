# ============================================================================
#  Audioengine A2+ (loa chính) - tắt idle-suspend + ghim làm thiết bị mặc định
# ----------------------------------------------------------------------------
#  LƯI Ý QUAN TRỌNG (sửa lỗi dead code):
#  WirePlumber 0.5 KHÔNG còn đọc section `device.rules`.
#  Sections rules hợp lệ (lấy từ:
#    grep -rn get_section_as_json /usr/share/wireplumber/scripts/)
#    -> access.rules, device.profile.priority.rules, monitor.alsa.rules,
#       monitor.bluez.rules, monitor.bluez-midi.rules, monitor.libcamera.rules,
#       monitor.v4l2.rules, node.filter-graph.rules, node.software-dsp.rules,
#       stream.rules
#  Vì vậy `device.rules = [...]` trong bản cũ là DEAD CODE: WirePlumber đọc
#  được section lạ thì bỏ qua, device.priority KHÔNG BAO GIỜ được đặt.
#  Đã kiểm chứng: sau khi restart, `pw-dump` cho
#    device.priority = <không có>  trên alsa_card.usb-Generic_USB_Audio-00
#
#  -> Sửa: đưa luôn rule device vào `monitor.alsa.rules`.
#     Đã đọc mã nguồn /usr/share/wireplumber/scripts/monitors/alsa.lua:
#       dòng 487 -> rules áp cho NODE properties
#       dòng 678 -> rules áp cho DEVICE properties
#     Cùng một `config.rules` cho cả hai, nên match `device.name` là hợp lệ.
#
#  Card A2+ USB thật: alsa_card.usb-Generic_USB_Audio-00
#  (ALSA id = "A2", long name = "Generic USB Audio at usb-0000:00:14.0-2")
#  LƯU Ý: loa còn có module Bluetooth riêng:
#    alsa_card.usb-Audioengine_Ltd._Audioengine_2__ABCDEFB1180003-00
#  Regex cố tình KHÔNG chạm vào card Bluetooth này.
# ============================================================================

monitor.alsa.rules = [
  # (1) Tắt idle-suspend cho toàn bộ node OUTPUT của card A2+.
  #     Kẹp cả S/PDIF + Headphones (cùng card) để đổi profile không bị pop.
  #     RegEx có neo ^ và escape dấu chấm, và khoá theo đúng card "-00"
  #     để không lỡ khớp card USB "Generic USB Audio" khác.
  {
    matches = [
      { node.name = "~^alsa_output\\.usb-Generic_USB_Audio-00\\." }
    ]
    actions = {
      update-props = {
        # 0 = không bao giờ tự suspend. suspend-node.lua đọc đúng key này.
        session.suspend-timeout-seconds = 0
      }
    }
  }

  # (2) Ghin priority cho CARD A2+ -> luôn là default sink sau khi
  #     unplug/replug, không bị rớt sang HDMI/EPOS/Bluetooth.
  {
    matches = [
      { device.name = "~^alsa_card\\.usb-Generic_USB_Audio-00$" }
    ]
    actions = {
      update-props = {
        device.priority = 2000
      }
    }
  }
]