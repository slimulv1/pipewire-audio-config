# ============================================================================
#  Sàn latency cho ứng dụng Wine/Proton (Steam game)
# ----------------------------------------------------------------------------
#  ĐÂY LÀ BUG UPSTREAM ĐÃ ĐƯỢC GHI NHẬN, KHÔNG PHẢI LỖI CẤU HÌNH CỦA BẠN:
#
#    ValveSoftware/Proton#7568 — "Game's audio causes crackling when using
#    recent pipewire" (braiam, kỹ sưng Valve, mở 2024-03-09, còn mở tới
#    2025-04-06):
#      "pipewire since version 0.3.67 has implemented tighter latency
#       timings. There are multiple reports of Wine/Proton apps having
#       issues."
#      "native apps/games don't seem to have issues with these configurations"
#
#  Ứng dụng Wine/Proton hay RÈ, ứng dụng native thì không — đúng triệu chứng
#  "chỉ bị khi mở game".
#
#  Cơ chế: PipeWire cho phép graph rơi tới `default.clock.min-quantum = 32`
#  (32 mẫu @48kHz = 0,67 ms). Giá trị đó nhỏ hơn nhiều mức mà USB DAC và
#  đường đệm của Wine định kỳ chịu được. Khi graph nhảy xuống đó, buffer
#  không kịp lấp đầy giữa hai lần bị gián đoạn -> RÈ.
#
#  Cách sửa (tương đương workaround chính thức trong issue): nâng sàn lên
#  256 mẫu = 5,33 ms. Đo được quantum ổn định cũng đang là 256, nên không
#  hy sinh độ trễ nào:
#
#      quantum 256 @48kHz = 5,33 ms  <->  sàn mới cũng 256  (không đổi)
#
#  default.clock.quantum-floor = 32
#      mặc định gốc của PipeWire là 4 (0,08 ms) — nhỏ phi lý, cho phép các
#      frame rất nhỏ chen vào giữa buffer. Nâng lên 32.
# ============================================================================

context.properties = {
    # Sàn quantum: chặn graph rơi xuống 32 mẫu (0,67 ms)
    default.clock.min-quantum = 256

    # Chặn frame chen siêu nhỏ (mặc định gốc là 4)
    default.clock.quantum-floor = 32
}