# ============================================================================
#  PipeWire context — thiết kế cho A2+ (loa chính) + EPOS GSX 300 (gaming)
# ----------------------------------------------------------------------------
#  CẢ HAI DAC đềU CHẠY NATIVE Ở 48 kHz:
#    - A2+   (USB 2.0, ALTA chỉ nhận S16_LE / 2ch / 48000 — đo bằng
#            `aplay --dump-hw-params -D hw:0,0`)
#    - EPOS  (USB 1.1, chạy 48000)
#
#  default.clock.rate = 48000
#    Khớp native của cả hai DAC -> không phải resample ở đường chính.
#
#  default.clock.allowed-rates = [ 48000 ]
#    CỐ Ý CHỈ CHO PHÉP 48000. Đo thực tế:
#      [ 44100, 48000 ] + client 44.1kHz -> PipeWire CẤU HÌNH LẠI DAC A2+
#                                    -> mất nhịp, tiếng click, mọi stream
#                                       đang phát bị resample
#      [ 48000 ]        + client 44.1kHz -> DAC giữ nguyên 48000, chỉ resample
#                                       cục bộ an toàn
#    Client 44.1 kHz (không ít game/movie) sẽ bị resample về 48k — đây là
#    lựa chọn đúng: giữ DAC ổn định quan trọng hơn việc giữ 44.1k nguyên bản
#    trên một DAC không chơi được 44.1k.
#
#  resample.quality = 11 (160 taps, cutoff 0.976)
#    Chỉ tốn CPU khi THẬT SỰ resample; đo được ~0.75% khi phát 48k.
#    Giữ mức cao vì A2+ nghe nhạc là mục đích chính.
# ============================================================================

context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    resample.quality            = 11
}