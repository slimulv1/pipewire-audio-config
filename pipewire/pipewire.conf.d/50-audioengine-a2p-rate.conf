# ============================================================================
#  PipeWire context: clock/rate policy cho Audioengine A2+ (loa chính)
# ----------------------------------------------------------------------------
#  ĐÃ KIỂM CHỨNG trên máy này (PipeWire 1.6.9):
#    pw-dump -> Core/info/props cho thấy:
#      default.clock.rate        = 48000
#      default.clock.allowed-rates = [ 48000 ]
#      resample.quality          = 11
#
#  VÌ SAO allowed-rates = [ 48000 ] (KHÔNG phải [ 44100, 48000 ]):
#  Đo thực tế bằng `pw-top -b` trên node
#  alsa_output.usb-Generic_USB_Audio-00.HiFi_7_1__Speaker__sink:
#
#    allowed-rates = [ 44100, 48000 ]  +  cho 1 client 44.1kHz chạy
#        -> I 58 2048  44100  ... S32LE 8 44100   <-- ĐỒ THỜI GIAN ĐỔI SANG 44100
#    allowed-rates = [ 48000 ]
#        -> I 58 1024  48000  ... S32LE 8 48000   <-- GIỮ NGUYÊN 48000
#
#  A2+ là DAC high-speed, native 48kHz (pactl: s32le 8ch 48000Hz).
#  Cho phép 44100 làm TOÀN BỘ graph đổi rate -> PipeWire phải cấu hình lại
#  DAC A2+ (mất nhịp, tiếng click, mọi stream đang phát bị resample).
#  Đó là nguồn mất ổn định, không phải lợi ích.
#  Pin cứng 48000: client 44.1kHz chỉ bị resample 44.1->48 (cục bộ, an toàn),
#  DAC không bao giờ phải đổi rate.
# ============================================================================

context.properties = {
    # A2+ native 48kHz
    default.clock.rate          = 48000

    # Chỉ cho phép 48000 -> chống đổi rate toàn cục (xem chú thích trên)
    default.clock.allowed-rates = [ 48000 ]

    # resample.quality hợp lệ: 0..14 (mảng 15 phần tử trong
    # spa/plugins/audioconvert/resample-native.c -> blackman_qualities[15]).
    # quality 11 = 160 taps, cutoff_up 0.976, cutoff_down 0.958.
    # Chỉ tốn CPU khi THẬT SỰ resample; nội dung 48k đi thẳng, không resample.
    resample.quality            = 11
}