# Audioengine A2+ Wireless (USB Type-B) — tối ưu chất lượng đường USB DAC
#
# Phát hiện phần cứng (qua /proc/asound/card0/stream0): DAC "Generic USB Audio"
# hỗ trợ S16_LE / S24_3LE / S32_LE, 44100–192000 Hz. Tức là DAC high-end
# (KHÔNG phải PCM2704C giới hạn 16-bit/48kHz). PipeWire tự negotiate lên S32_LE,
# nên KHÔNG cần dither (ở 24/32-bit nhiễu lượng tử đã dưới mức nghe được).
#
# Chiến lược:
#  - Giữ graph ở 48000 (native cho phần lớn nhạc), cho phép 44100 để nhạc 44.1k
#    phát NATIVE, loại bỏ hẳn resampling cho 2 rate phổ biến nhất.
#  - resample.quality = 10 (tier "critical listening") cho các file hi-res (96k/192k)
#    vẫn phải resample xuống 48k.

context.properties = {
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 44100, 48000 ]
    resample.quality = 10
}
