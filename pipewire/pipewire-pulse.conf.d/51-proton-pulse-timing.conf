# ============================================================================
#  pipewire-pulse: nới lỏng giới hạn buffer cho client PulseAudio
# ----------------------------------------------------------------------------
#  Nửa còn lại của workaround trong ValveSoftware/Proton#7568:
#      "Using a workaround that changes pipewire-pulse timings to the previous
#       default mitigates this issue"
#           pulse.min.req     = 256/48000
#           pulse.min.frag    = 256/48000
#           pulse.min.quantum = 256/48000
#
#  PipeWire từ 0.3.67 siết các giá trị này lại -> app Wine bị RÈ.
#
#  File cấu hình chính của pipewire-pulse ghi rõ chỗ đặt:
#      "contents of pulse.properties can also be placed here"
#  nên đặt vào `args` của `libpipewire-module-protocol-pulse`.
#
#  256/48000 = 5,33 ms — trùng quantum đang chạy, không tăng độ trễ.
#
#  Áp dụng song song với 51-proton-latency-floor.conf:
#    - file này -> client đi qua pipewire-pulse (libpulse)
#    - file kia  -> graph của PipeWire nói chung, kể cả client native
# ============================================================================

context.modules = [
  {
    name = libpipewire-module-protocol-pulse
    args = {
      pulse.min.req     = 256/48000
      pulse.min.frag    = 256/48000
      pulse.min.quantum = 256/48000
    }
  }
]